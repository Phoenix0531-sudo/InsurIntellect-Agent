# InsurIntellect Agent - Ingestion Config
# 说明：此配置用于控制 PDF 文档的处理方式（解析、分块、OCR 回退、去重）
# 可根据不同类型文档设置差异化策略，最终统一写入同一 Chroma 集合

general:
  persist_directory: "./data/vector_db/chroma"
  collection_name: "insurance_documents"
  write_mode: "append"
  batch_size: 32
  embedding_model: ""
  ocr:
    enabled_default: false
    lang: "chi_sim+eng"
    tesseract_cmd: 'D:\\0.Softwares\\tesseract\\tesseract.exe'

# 单一数据源目录，所有PDF均在此目录下（含子目录）
sources:
  - name: "all"
    path: "./data/documents/pdfs"
    document_type: "通用"
    parser_preference: "auto"
    ocr:
      enabled: false
      lang: "chi_sim+eng"
    chunk:
      token_based: true
      chunk_size: 256
      chunk_overlap: 32
      separators: ["\n\n", "\n", " ", ""]
    dedup:
      enabled: true
      method: "sequence_ratio"
      threshold: 0.96

# 基于文件名的分类规则与每类的处理配置（profiles）
classification:
  enabled: true
  patterns:
    terms: ["tk", "TK"]
    manuals: ["sms", "SMS"]
    tables: ["flbe", "FLBE"]

profiles:
  terms:
    document_type: "条款"
    ocr:
      enabled: false
      lang: "chi_sim+eng"
    chunk:
      token_based: true
      chunk_size: 240
      chunk_overlap: 32
      separators: ["\n\n", "\n", " ", ""]
    dedup:
      enabled: true
      method: "sequence_ratio"
      threshold: 0.96

  manuals:
    document_type: "说明书"
    ocr:
      enabled: false
      lang: "chi_sim+eng"
    chunk:
      token_based: true
      chunk_size: 256
      chunk_overlap: 32
      separators: ["\n\n", "\n", " ", ""]
    dedup:
      enabled: true
      method: "sequence_ratio"
      threshold: 0.96

  tables:
    document_type: "费率/利益"
    ocr:
      enabled: false
      lang: "chi_sim+eng"
    chunk:
      token_based: false
      chunk_size: 200
      chunk_overlap: 24
      separators: ["\n", " ", ""]
    dedup:
      enabled: true
      method: "sequence_ratio"
      threshold: 0.98

