<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InsurIntellect iteration 5 — refined favicon citation card">
  <!-- From iteration-2: tighter optical center, stronger page cue, slightly larger evidence block -->
  <g id="icon">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="#0B1F33"/>

    <g id="citation-card">
      <!-- Card body, optically centered a touch lower for balance -->
      <rect x="124" y="100" width="264" height="312" rx="40" fill="#FFFFFF"/>

      <!-- Doc chip (left) -->
      <rect x="156" y="140" width="104" height="44" rx="22" fill="#1D9CFF"/>

      <!-- Page cue (right) — square-ish for "page" not just a dot -->
      <rect x="300" y="140" width="52" height="44" rx="14" fill="#E8F4FF"/>
      <rect x="312" y="152" width="28" height="20" rx="5" fill="#1D9CFF"/>

      <!-- Two fat clause lines -->
      <rect x="156" y="220" width="184" height="28" rx="14" fill="#C5D6E8"/>
      <rect x="156" y="272" width="148" height="28" rx="14" fill="#C5D6E8"/>

      <!-- Evidence block -->
      <rect x="144" y="328" width="224" height="60" rx="20" fill="#1D9CFF"/>
      <rect x="176" y="346" width="128" height="24" rx="12" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
