<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsurIntellect · ChatPDF shell</title>
  <!--
    UI shell ported from trangiabach/chat-pdf:
    - Navbar (components/common/navbar)
    - ChatPanel = ResizablePanelGroup: ChatPdfPanel | handle | ChatAIPanel
    - ChatPdfControlPanel + ChatPdfViewer (pdf.js Worker/Viewer)
    - ChatAIControlPanel + ChatAIWindow + ChatMessages + ChatAIInput
    Tokens from app/globals.css + lib/consts.tsx primary #1D9CFF
  -->
  <link rel="stylesheet" href="https://unpkg.com/@react-pdf-viewer/core@3.12.0/lib/styles/index.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <!-- Navbar: sticky top-0 border-b border-border/40 bg-background/95 backdrop-blur -->
  <header class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="/" aria-label="home">
        <span class="logo-icons" aria-hidden="true">
          <svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="#1D9CFF"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path fill="#fff" d="M14 2v6h6"/><path fill="#fff" d="M8 13h8v2H8zm0 4h5v2H8z"/></svg>
          <svg class="ico-sm" viewBox="0 0 24 24" width="11" height="11" fill="#1D9CFF"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
          <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="#1D9CFF"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zm6 10l.9 2.7L22 16l-3.1.9L18 20l-.9-3.1L14 16l3.1-.9L18 12zM6 14l.9 2.7L10 18l-3.1.9L6 22l-.9-3.1L2 18l3.1-.9L6 14z"/></svg>
        </span>
        <span class="logo-sep">/</span>
        <span class="logo-title">ChatPDF</span>
        <span class="logo-sub">InsurIntellect</span>
      </a>
      <div class="toolbar">
        <span id="healthText" class="toolbar-meta">checking</span>
        <a class="btn btn-ghost" href="https://github.com/trangiabach/chat-pdf" target="_blank" rel="noreferrer">
          <span class="hide-sm">Source shell</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.1 3.29 9.42 7.86 10.95.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.78 2.73 1.27 3.4.97.11-.75.41-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.67.42.36.79 1.08.79 2.18 0 1.57-.01 2.84-.01 3.23 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.74 18.27.5 12 .5z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- ChatPanel: group w-full h-full; ResizablePanelGroup horizontal -->
  <main class="chat-panel">
    <div class="panel-group" id="panelGroup">
      <!-- ChatPdfPanel -->
      <section class="panel pdf-panel" id="pdfPanel" style="flex: 1 1 50%; min-width: 20%;">
        <!-- ChatPdfControlPanel sticky -->
        <div class="control-bar">
          <div class="control-left">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="#1D9CFF" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path fill="#fff" d="M14 2v6h6"/></svg>
            <!-- ChatPdfPicker -->
            <select id="pdfSelect" class="select-trigger" aria-label="Pick a PDF file">
              <option value="">Pick a PDF file...</option>
            </select>
          </div>
          <div class="control-right">
            <span id="corpusMeta" class="muted text-xs"></span>
          </div>
        </div>
        <!-- ChatPdfViewer / Empty -->
        <div class="pdf-viewer-wrap" id="pdfViewerWrap">
          <div id="pdfEmpty" class="pdf-empty">
            <div class="pdf-empty-inner">
              <svg viewBox="0 0 24 24" width="60" height="60" fill="#1D9CFF" aria-hidden="true"><path d="M4 4h16v2H4V4zm0 4h10v2H4V8zm0 4h16v2H4v-2zm0 4h10v2H4v-2z" opacity=".35"/><path d="M19 13v6H5v-6H3v8h18v-8h-2z"/></svg>
              <span class="pdf-empty-title">Wow, so empty</span>
              <span class="pdf-empty-badge">Pick a PDF to get started!</span>
            </div>
          </div>
          <iframe id="pdfFrame" class="pdf-frame" title="PDF viewer" hidden></iframe>
        </div>
      </section>

      <!-- ResizableHandle withHandle -->
      <div class="resize-handle" id="resizeHandle" role="separator" aria-orientation="vertical" title="Drag to resize">
        <div class="resize-grip" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- ChatAIPanel -->
      <section class="panel ai-panel" id="aiPanel" style="flex: 1 1 50%; min-width: 20%;">
        <!-- ChatAIControlPanel -->
        <div class="control-bar">
          <div class="control-left">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#1D9CFF" aria-hidden="true"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zm6 10l.9 2.7L22 16l-3.1.9L18 20l-.9-3.1L14 16l3.1-.9L18 12z"/></svg>
            <div class="ai-picker-label">
              <span class="ai-picker-title">Clause RAG</span>
              <span class="ai-picker-sub">答案附条款出处 · 无依据则拒答</span>
            </div>
          </div>
          <label class="stream-label">
            <input type="checkbox" id="streamToggle" />
            <span>Stream</span>
          </label>
        </div>

        <!-- ChatAIWindow -->
        <div class="ai-window" id="aiWindow">
          <div id="messages" class="messages" hidden>
            <!-- ChatMessages filled by JS -->
          </div>
          <div id="emptyChat" class="empty-chat">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="#1D9CFF" aria-hidden="true"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zm6 10l.9 2.7L22 16l-3.1.9L18 20l-.9-3.1L14 16l3.1-.9L18 12z"/></svg>
            <span class="text-sm">Send a message and start chatting!</span>
            <div class="prompt-row">
              <button type="button" class="prompt-chip" data-q="等待期是多久？">等待期是多久？</button>
              <button type="button" class="prompt-chip" data-q="责任免除包括哪些情形？">责任免除包括哪些情形？</button>
              <button type="button" class="prompt-chip" data-q="这份保单保证我一定能获赔吗？">这份保单保证我一定能获赔吗？</button>
            </div>
            <p class="legal-line">Not regulated insurance advice · 不构成销售/核保/理赔承诺</p>
          </div>

          <!-- ChatAIInput sticky bottom -->
          <div class="composer-sticky">
            <form id="askForm" class="composer-form" autocomplete="off">
              <div id="genPill" class="gen-pill" hidden>
                <span>Generating</span>
                <span class="spin">↻</span>
              </div>
              <div id="errPill" class="err-pill" hidden></div>
              <textarea
                id="messageInput"
                class="composer-textarea"
                placeholder="Talk to your ChatPDF!"
                required
              ></textarea>
              <div class="composer-actions">
                <button type="button" id="resetBtn" class="btn btn-outline btn-xs">
                  <span>Reset</span>
                </button>
                <button type="button" id="stopBtn" class="btn btn-outline btn-xs" hidden>
                  <span>Stop</span>
                </button>
                <button type="submit" id="sendBtn" class="btn btn-primary btn-xs">
                  <span>Send</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
