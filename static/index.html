<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsurIntellect · 条款检索</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app">
    <!-- Left: knowledge sources (RAGFlow / NotebookLM / ChatPDF) -->
    <aside class="sources-pane" aria-label="知识库">
      <header class="sources-head">
        <div class="product-name">InsurIntellect</div>
        <p class="product-tagline">本地条款库 · 带引用问答</p>
      </header>

      <div class="sources-toolbar">
        <span class="section-label">来源</span>
        <span id="corpusCount" class="count-chip">—</span>
      </div>

      <div id="docList" class="source-list" role="list">
        <div class="source-empty">加载来源…</div>
      </div>

      <div class="sources-foot">
        <p class="legal">
          仅基于已入库条款片段作答并附出处。
          <strong>不构成</strong>保险销售、核保或理赔承诺
          （Not regulated insurance advice）。
        </p>
        <div class="foot-meta">
          <span id="healthDot" class="dot" title="health"></span>
          <span id="healthText" class="foot-status">checking</span>
        </div>
      </div>
    </aside>

    <!-- Right: Q&A workspace -->
    <section class="work-pane">
      <header class="work-bar">
        <div class="work-bar-left">
          <h1>条款问答</h1>
          <span class="work-hint">答案中的 [n] 对应下方来源卡片</span>
        </div>
        <div class="work-bar-right">
          <label class="stream-opt" title="服务端 SSE">
            <input type="checkbox" id="streamToggle" />
            <span>流式输出</span>
          </label>
          <button type="button" id="clearBtn" class="ghost-btn">清空对话</button>
        </div>
      </header>

      <div id="thread" class="thread" aria-live="polite">
        <!-- Dify-style empty state -->
        <div id="emptyState" class="empty-state">
          <div class="empty-kicker">从条款出发，而不是从建议出发</div>
          <h2>就已索引的保单条款提问</h2>
          <p class="empty-desc">
            系统会 hybrid 检索片段，再生成带编号引用的结构化回答。
            无充分依据时会明确说明，而不是编造责任或保额。
          </p>
          <div class="prompt-grid" id="promptGrid">
            <button type="button" class="prompt-card" data-q="等待期是多久？">
              <span class="prompt-k">条款事实</span>
              <span class="prompt-q">等待期是多久？</span>
              <span class="prompt-h">对照终身寿 / 重疾样例条款</span>
            </button>
            <button type="button" class="prompt-card" data-q="责任免除包括哪些情形？">
              <span class="prompt-k">责任范围</span>
              <span class="prompt-q">责任免除包括哪些情形？</span>
              <span class="prompt-h">多点列举并对应引用</span>
            </button>
            <button type="button" class="prompt-card" data-q="这份保单保证我一定能获赔吗？">
              <span class="prompt-k">边界测试</span>
              <span class="prompt-q">保证我一定能获赔吗？</span>
              <span class="prompt-h">应拒答 / 强免责，不给承诺</span>
            </button>
          </div>
        </div>
      </div>

      <footer class="composer-wrap">
        <form id="askForm" class="composer">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="输入与条款相关的问题… Enter 发送，Shift+Enter 换行"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="sendButton" class="send-btn">检索并回答</button>
        </form>
        <p class="composer-note">演示语料为公开假条款 PDF，非真实客户保单。</p>
      </footer>
    </section>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
