<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsurIntellect — 条款 RAG</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">II</div>
        <div>
          <div class="brand-title">InsurIntellect</div>
          <div class="brand-sub">基于已入库保险条款的本地问答</div>
        </div>
      </div>

      <section class="panel">
        <div class="panel-head">已索引文档</div>
        <ul id="docList" class="doc-list">
          <li class="muted">加载中…</li>
        </ul>
        <div id="corpusMeta" class="muted small"></div>
      </section>

      <section class="panel">
        <div class="panel-head">示例问题</div>
        <div class="example-list">
          <button type="button" class="example-btn" data-q="等待期是多久？">等待期是多久？</button>
          <button type="button" class="example-btn" data-q="责任免除包括哪些情形？">责任免除包括哪些情形？</button>
          <button type="button" class="example-btn" data-q="这份保单保证我一定能获赔吗？">这份保单保证我一定能获赔吗？</button>
        </div>
      </section>

      <section class="panel disclaimer">
        <strong>免责声明</strong>
        <p>本系统仅检索已入库条款片段并附引用，不构成保险销售、核保、理赔承诺或任何受监管建议（Not regulated insurance advice）。</p>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>条款问答</h1>
          <p class="muted">hybrid 检索 → 结构化答案 → 引用卡</p>
        </div>
        <div class="status-row">
          <span id="healthPill" class="pill">checking</span>
          <label class="switch">
            <input type="checkbox" id="streamToggle" />
            <span>流式</span>
          </label>
        </div>
      </header>

      <div id="chatMessages" class="chat">
        <div class="welcome" id="welcome">
          <h2>从左侧选文档或示例问题开始</h2>
          <p>答案会附带条款来源、页码与摘录。无充分依据时会明确拒答，而不是编造责任。</p>
        </div>
      </div>

      <form id="askForm" class="composer">
        <textarea id="messageInput" rows="2" placeholder="就已入库条款提问，例如：犹豫期几天？"></textarea>
        <button type="submit" id="sendButton">提问</button>
      </form>
    </main>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
