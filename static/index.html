<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsurIntellect · 条款问答</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <!--
    Layout port notes (static HTML adaptation, not a framework rewrite):
    - chatpdf-yt ChatPage: left sidebar + right chat (border-l slate)
    - trangiabach/chat-pdf ChatPanel: dual pane sticky control bars + AI window
    - Mintplex AnythingLLM light theme tokens (index.css [data-theme=light])
    - AnythingLLM SuggestedMessages + Citation / SourceItem patterns
  -->

  <!-- chat-pdf Navbar: sticky top bar, border-b, backdrop -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <strong>InsurIntellect</strong>
          <span>本地条款 RAG · 带引用作答</span>
        </div>
      </div>
      <div class="navbar-right">
        <span id="healthDot" class="status-dot" title="health"></span>
        <span id="healthText" class="status-text">checking</span>
      </div>
    </div>
  </header>

  <!-- chatpdf-yt page shell: flex max-h-screen -->
  <main class="shell">
    <!-- Left: ChatSideBar (chatpdf-yt) — document / knowledge list -->
    <aside class="sidebar" aria-label="已索引文档">
      <div class="sidebar-head">
        <button type="button" id="clearBtn" class="btn-new">
          <span class="btn-new-icon">+</span>
          新会话
        </button>
      </div>

      <div class="sidebar-section-label">知识库文档</div>
      <div id="docList" class="doc-list" role="list">
        <div class="doc-empty">加载文档…</div>
      </div>

      <div class="sidebar-foot">
        <p class="legal">
          仅基于已入库条款片段作答并附出处。
          <strong>不构成</strong>保险销售、核保或理赔承诺
          （Not regulated insurance advice）。
        </p>
        <div class="corpus-meta">
          <span id="corpusCount">—</span>
        </div>
      </div>
    </aside>

    <!-- Right: ChatComponent (chatpdf-yt) / ChatAIPanel (chat-pdf) -->
    <section class="chat-pane" aria-label="问答">
      <!-- chat-pdf ChatAIControlPanel sticky bar -->
      <div class="chat-control">
        <div class="chat-control-left">
          <span class="control-icon" aria-hidden="true">✦</span>
          <div class="control-titles">
            <h1>Chat</h1>
            <p>答案附条款出处 · 无依据则拒答</p>
          </div>
        </div>
        <label class="stream-label" title="SSE stream">
          <input type="checkbox" id="streamToggle" />
          <span>流式</span>
        </label>
      </div>

      <!-- message container -->
      <div id="thread" class="thread" role="log" aria-live="polite">
        <!-- AnythingLLM DefaultChat / SuggestedMessages empty -->
        <div id="emptyState" class="empty-state">
          <div class="empty-hero">
            <div class="empty-icon" aria-hidden="true">✦</div>
            <h2>基于已入库保险条款提问</h2>
            <p>系统会检索样例条款并返回带编号的引用。不提供投保建议。</p>
          </div>
          <div class="suggested" id="suggestedMessages">
            <button type="button" class="suggested-item prompt-card" data-q="等待期是多久？">
              等待期是多久？
            </button>
            <button type="button" class="suggested-item prompt-card" data-q="责任免除包括哪些情形？">
              责任免除包括哪些情形？
            </button>
            <button type="button" class="suggested-item prompt-card" data-q="这份保单保证我一定能获赔吗？">
              这份保单保证我一定能获赔吗？
            </button>
          </div>
        </div>
      </div>

      <!-- chat-pdf ChatAIInput sticky bottom -->
      <div class="composer-wrap">
        <form id="askForm" class="composer" autocomplete="off">
          <textarea
            id="messageInput"
            rows="3"
            placeholder="Ask any question about the indexed clauses…"
            required
          ></textarea>
          <div class="composer-actions">
            <button type="button" id="resetBtn" class="btn btn-outline">Reset</button>
            <button type="submit" id="sendButton" class="btn btn-primary">
              Send
            </button>
          </div>
        </form>
        <p class="composer-hint">Enter 发送 · Shift+Enter 换行 · 仅检索已入库 PDF</p>
      </div>
    </section>
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
