    <!-- JavaScript -->

    <script>
        // 初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();

        // 切换侧边栏
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const sidebarContainer = sidebar.querySelector('.sidebar-container');
            const sidebarContent = sidebar.querySelectorAll('.sidebar-content');
            const sidebarText = sidebar.querySelectorAll('.sidebar-text');
            
            if (sidebar.classList.contains('w-80')) {
                // 收缩侧边栏
                sidebar.classList.remove('w-80');
                sidebar.classList.add('w-16');
                
                // 隐藏文本内容
                sidebarContent.forEach(el => el.classList.add('hidden'));
                sidebarText.forEach(el => el.classList.add('hidden'));
                
                // 调整按钮样式
                const newChatBtn = sidebar.querySelector('button[onclick="startNewChat()"]');
                if (newChatBtn) {
                    newChatBtn.innerHTML = '<i class="fas fa-plus"></i>';
                    newChatBtn.classList.add('w-10', 'h-10', 'p-0');
                    newChatBtn.classList.remove('px-4', 'py-3');
                }
            } else {
                // 展开侧边栏
                sidebar.classList.remove('w-16');
                sidebar.classList.add('w-80');
                
                // 显示文本内容
                sidebarContent.forEach(el => el.classList.remove('hidden'));
                sidebarText.forEach(el => el.classList.remove('hidden'));
                
                // 恢复按钮样式
                const newChatBtn = sidebar.querySelector('button[onclick="startNewChat()"]');
                if (newChatBtn) {
                    newChatBtn.innerHTML = '<i class="fas fa-plus text-sm"></i><span class="font-medium sidebar-text">新建对话</span>';
                    newChatBtn.classList.remove('w-10', 'h-10', 'p-0');
                    newChatBtn.classList.add('px-4', 'py-3');
                }
            }
        }

        // 切换侧边栏
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        // 开始新对话
        function startNewChat() {
            clearChatMessages();
            showWelcomeSection();
        }

        // 清空聊天消息
        function clearChatMessages() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
        }

        // 显示欢迎区域
        function showWelcomeSection() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = `
                <div class="max-w-4xl mx-auto" id="welcomeSection">
                    <div class="text-center mb-12">
                        <h1 class="text-3xl font-light text-gray-900 dark:text-white mb-3">InsurIntellect</h1>
                        <p class="text-gray-600 dark:text-gray-400 text-lg font-light">
                            智能保险助手
                        </p>
                    </div>

                    <!-- 建议提示 -->
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <button class="text-left p-6 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 hover:shadow-sm transition-all" onclick="sendPrompt('帮我分析一下重疾险的保障范围和理赔条件')">
                                <div class="font-medium text-gray-900 dark:text-white mb-2">重疾险分析</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400">了解重疾险的保障范围和理赔条件</div>
                            </button>
                            <button class="text-left p-6 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 hover:shadow-sm transition-all" onclick="sendPrompt('我想了解不同年龄段应该如何配置保险')">
                                <div class="font-medium text-gray-900 dark:text-white mb-2">保险配置建议</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400">根据年龄段提供个性化保险配置方案</div>
                            </button>
                            <button class="text-left p-6 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 hover:shadow-sm transition-all" onclick="sendPrompt('请帮我比较几款热门的医疗险产品')">
                                <div class="font-medium text-gray-900 dark:text-white mb-2">医疗险对比</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400">对比分析不同医疗险产品的优势</div>
                            </button>
                            <button class="text-left p-6 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 hover:shadow-sm transition-all" onclick="sendPrompt('详细了解保险理赔流程和所需材料')">
                                <div class="font-medium text-gray-900 dark:text-white mb-2">理赔指导</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400">详细了解保险理赔流程和所需材料</div>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 发送建议提示
        function sendPrompt(message) {
            const input = document.getElementById('chat-input');
            input.value = message;
            sendMessage();
        }

        // 文件上传功能已移除

            // 分享功能待实现
            console.log('分享对话功能待实现');
        }

        // 打开设置
        function openSettings() {
            // 设置功能待实现
            console.log('设置功能待实现');
        }

        // 清空聊天历史
        function clearChatHistory() {
            const historyList = document.getElementById('chatHistoryList');
            historyList.innerHTML = '';
        }

        // 处理键盘输入
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 调整文本框高度
        function adjustTextareaHeight(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        // 更新字符计数
        function updateCharCounter() {
            const input = document.getElementById('chat-input');
            const charCount = document.getElementById('charCount');
            const sendButton = document.getElementById('sendButton');
            
            // 检查元素是否存在，避免null错误
            if (charCount) {
                charCount.textContent = input.value.length;
            }
            if (sendButton) {
                sendButton.disabled = input.value.trim().length === 0;
            }
        }

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 隐藏欢迎区域
            const welcomeSection = document.getElementById('welcomeSection');
            if (welcomeSection) {
                welcomeSection.style.display = 'none';
            }
            
            // 添加用户消息到聊天区域
            addMessageToChat('user', message);
            
            // 清空输入框
            input.value = '';
            updateCharCounter();
            adjustTextareaHeight(input);
            
            // 发送到后端
            sendToBackend(message);
        }

        // 添加消息到聊天区域
        function addMessageToChat(sender, message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `mb-6`;
            
            if (sender === 'user') {
                messageDiv.innerHTML = `
                    <div class="flex justify-end">
                        <div class="max-w-2xl bg-gray-600 text-white rounded-2xl px-4 py-3">
                            <p class="whitespace-pre-wrap">${message}</p>
                        </div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-robot text-white text-sm"></i>
                        </div>
                        <div class="flex-1 bg-white dark:bg-gray-800 rounded-2xl px-4 py-3 border border-gray-200 dark:border-gray-700">
                            <p class="whitespace-pre-wrap text-gray-900 dark:text-white">${message}</p>
                        </div>
                    </div>
                `;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 发送到后端
        async function sendToBackend(message) {
            try {
                const response = await fetch('/api/v1/queries/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        question: message,
                        query_type: 'general'
                    })
                });
                
                const data = await response.json();
                addMessageToChat('assistant', data.answer);
            } catch (error) {
                console.error('Error:', error);
                addMessageToChat('assistant', '抱歉，发生了错误，请稍后再试。');
            }
        }

        // 更新字符计数器
        function updateCharCounter() {
            const input = document.getElementById('chat-input');
            const counter = document.getElementById('char-counter');
            if (input && counter) {
                const currentLength = input.value.length;
                const maxLength = 2000;
                counter.textContent = `${currentLength}/${maxLength}`;
                
                if (currentLength > maxLength * 0.9) {
                    counter.classList.add('text-red-500');
                    counter.classList.remove('text-gray-500');
                } else {
                    counter.classList.add('text-gray-500');
                    counter.classList.remove('text-red-500');
                }
            }
        }
    </script>
</body>
</html>
