<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsurIntellect · 条款引用问答</title>
  <!--
    Visual shell from trangiabach/chat-pdf (Navbar + dual pane + tokens #1D9CFF).
    Product: ask first → cited answer → left pane follows citation PDF + evidence strip.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="/" aria-label="home">
        <span class="logo-icons" aria-hidden="true">
          <svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="#1D9CFF"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path fill="#fff" d="M14 2v6h6"/><path fill="#fff" d="M8 13h8v2H8zm0 4h5v2H8z"/></svg>
          <svg class="ico-sm" viewBox="0 0 24 24" width="11" height="11" fill="#1D9CFF"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
          <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="#1D9CFF"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zm6 10l.9 2.7L22 16l-3.1.9L18 20l-.9-3.1L14 16l3.1-.9L18 12z"/></svg>
        </span>
        <span class="logo-sep">/</span>
        <span class="logo-title">InsurIntellect</span>
        <span class="logo-sub">条款 PDF · 引用问答</span>
      </a>
      <div class="toolbar">
        <span id="healthText" class="toolbar-meta">检查中</span>
        <span id="corpusMeta" class="toolbar-meta"></span>
      </div>
    </div>
  </header>

  <main class="chat-panel">
    <div class="panel-group" id="panelGroup">
      <!-- Left: citation-driven PDF evidence pane -->
      <section class="panel pdf-panel" id="pdfPanel" style="flex: 1 1 48%; min-width: 22%;">
        <div class="control-bar">
          <div class="control-left">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#1D9CFF" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path fill="#fff" d="M14 2v6h6"/></svg>
            <div class="ai-picker-label">
              <span class="ai-picker-title" id="pdfTitle">引用原文</span>
              <span class="ai-picker-sub" id="pdfSubtitle">提问后自动打开答案引用的条款 PDF</span>
            </div>
          </div>
          <div class="control-right">
            <select id="pdfSelect" class="select-trigger select-compact" aria-label="切换引用文档" hidden>
              <option value="">暂无引用文档</option>
            </select>
            <span id="pageBadge" class="page-badge" hidden></span>
          </div>
        </div>
        <div id="evidenceStrip" class="evidence-strip" hidden>
          <div class="evidence-strip-top">
            <span class="evidence-label">当前证据</span>
            <span id="evidenceCite" class="evidence-cite"></span>
          </div>
          <div id="evidenceExcerpt" class="evidence-excerpt"></div>
        </div>
        <div class="pdf-viewer-wrap" id="pdfViewerWrap">
          <div id="pdfEmpty" class="pdf-empty">
            <div class="pdf-empty-inner">
              <svg viewBox="0 0 24 24" width="56" height="56" fill="#1D9CFF" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" opacity=".25"/><path d="M14 2v6h6"/><path d="M8 13h8v1.5H8zm0 3.5h5V18H8z"/></svg>
              <span class="pdf-empty-title">等待引用</span>
              <span class="pdf-empty-desc">在右侧提问后，这里会打开答案所依据的条款 PDF，并显示当前引用摘录。</span>
            </div>
          </div>
          <iframe id="pdfFrame" class="pdf-frame" title="引用 PDF" hidden></iframe>
        </div>
      </section>

      <div class="resize-handle" id="resizeHandle" role="separator" aria-orientation="vertical" title="拖动调整宽度">
        <div class="resize-grip" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>

      <!-- Right: ask / answer / citations -->
      <section class="panel ai-panel" id="aiPanel" style="flex: 1 1 52%; min-width: 28%;">
        <div class="control-bar">
          <div class="control-left">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#1D9CFF" aria-hidden="true"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zm6 10l.9 2.7L22 16l-3.1.9L18 20l-.9-3.1L14 16l3.1-.9L18 12z"/></svg>
            <div class="ai-picker-label">
              <span class="ai-picker-title">条款问答</span>
              <span class="ai-picker-sub">混合检索 · 有据才答 · 点击引用看原文</span>
            </div>
          </div>
          <label class="stream-label">
            <input type="checkbox" id="streamToggle" />
            <span>流式输出</span>
          </label>
        </div>

        <div class="ai-window" id="aiWindow">
          <div id="messages" class="messages" hidden></div>

          <div id="emptyChat" class="empty-chat">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="#1D9CFF" aria-hidden="true"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zm6 10l.9 2.7L22 16l-3.1.9L18 20l-.9-3.1L14 16l3.1-.9L18 12z"/></svg>
            <span class="empty-lead">基于已入库保险条款提问</span>
            <span class="empty-hint">答案分「结论 / 条款依据 / 不确定边界」；左侧自动打开被引用的 PDF。</span>
            <div class="prompt-row">
              <button type="button" class="prompt-chip" data-q="等待期是多久？">等待期是多久？</button>
              <button type="button" class="prompt-chip" data-q="责任免除包括哪些情形？">责任免除包括哪些情形？</button>
              <button type="button" class="prompt-chip" data-q="这份保单保证我一定能获赔吗？">这份保单保证我一定能获赔吗？</button>
            </div>
            <p class="legal-line">不构成销售 / 核保 / 理赔承诺 · Not regulated insurance advice</p>
          </div>

          <div class="composer-sticky">
            <form id="askForm" class="composer-form" autocomplete="off">
              <div id="genPill" class="gen-pill" hidden>
                <span>生成中</span>
                <span class="spin">↻</span>
              </div>
              <div id="errPill" class="err-pill" hidden></div>
              <textarea
                id="messageInput"
                class="composer-textarea"
                placeholder="问条款问题，例如：等待期是多久？"
                rows="3"
                required
              ></textarea>
              <div class="composer-actions">
                <button type="button" id="resetBtn" class="btn btn-outline btn-xs">重置</button>
                <button type="button" id="stopBtn" class="btn btn-outline btn-xs" hidden>停止</button>
                <button type="submit" id="sendBtn" class="btn btn-primary btn-xs" disabled>发送</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
