<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" role="img" aria-labelledby="title desc">
  <title id="title">InsurIntellect rounded mascot logo</title>
  <desc id="desc">A round blue and teal insurance AI robot mascot above a large black InsurIntellect wordmark on a white background.</desc>

  <rect width="820" height="640" fill="#FFFFFF"/>

  <!-- FinRobot-style composition: one big centered mascot, minimal details, oversized black wordmark. -->
  <g id="mascot" transform="translate(0 10)">
    <!-- legs and feet -->
    <g stroke="#050914" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
      <rect x="319" y="378" width="64" height="88" rx="25" fill="#1D4ED8"/>
      <rect x="437" y="378" width="64" height="88" rx="25" fill="#1D4ED8"/>
      <rect x="303" y="441" width="96" height="54" rx="27" fill="#7FA7B8"/>
      <rect x="421" y="441" width="96" height="54" rx="27" fill="#7FA7B8"/>
      <rect x="328" y="410" width="46" height="20" rx="10" fill="#22D3EE" stroke-width="0"/>
      <rect x="446" y="410" width="46" height="20" rx="10" fill="#22D3EE" stroke-width="0"/>
    </g>

    <!-- soft round arms, kept simple and toy-like -->
    <g stroke="#050914" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
      <path d="M292 269c-57 17-92 58-91 114" fill="none"/>
      <path d="M528 269c57 17 92 58 91 114" fill="none"/>
      <rect x="184" y="352" width="78" height="96" rx="38" fill="#7FA7B8" transform="rotate(-10 223 400)"/>
      <rect x="558" y="352" width="78" height="96" rx="38" fill="#7FA7B8" transform="rotate(10 597 400)"/>
      <rect x="197" y="372" width="52" height="28" rx="14" fill="#22D3EE" transform="rotate(-10 223 386)" stroke-width="0"/>
      <rect x="571" y="372" width="52" height="28" rx="14" fill="#22D3EE" transform="rotate(10 597 386)" stroke-width="0"/>
    </g>

    <!-- chunky rounded torso -->
    <g stroke="#050914" stroke-width="13" stroke-linejoin="round">
      <rect x="284" y="264" width="252" height="172" rx="62" fill="#12B8B0"/>
      <path d="M487 274c31 13 49 41 49 76v29c0 32-24 57-55 57h-34c28-28 47-79 40-162z" fill="#0E8F8B" opacity="0.62" stroke-width="0"/>
      <rect x="332" y="301" width="156" height="58" rx="24" fill="#050914"/>
      <rect x="363" y="319" width="94" height="17" rx="8.5" fill="#67E8F9" stroke-width="0"/>
      <path d="M368 390l23 22 59-66" fill="none" stroke="#FACC15" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- neck -->
    <rect x="361" y="232" width="98" height="54" rx="24" fill="#7FA7B8" stroke="#050914" stroke-width="13"/>

    <!-- oversized cute head -->
    <g stroke="#050914" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <rect x="252" y="50" width="316" height="236" rx="74" fill="#2563EB"/>
      <path d="M499 61c43 16 69 54 69 104v47c0 42-32 74-74 74h-58c36-43 61-119 63-225z" fill="#1E40AF" opacity="0.56" stroke-width="0"/>
      <rect x="310" y="83" width="200" height="64" rx="26" fill="#050914"/>
      <rect x="349" y="103" width="122" height="20" rx="10" fill="#67E8F9" stroke-width="0"/>
      <circle cx="350" cy="193" r="40" fill="#050914"/>
      <circle cx="470" cy="193" r="40" fill="#050914"/>
      <circle cx="350" cy="193" r="20" fill="#FACC15" stroke-width="0"/>
      <circle cx="470" cy="193" r="20" fill="#FACC15" stroke-width="0"/>
      <path d="M381 241c18 14 40 14 58 0" fill="none" stroke="#E0F2FE" stroke-width="12"/>
      <!-- small side insurance tabs instead of complex document details -->
      <rect x="232" y="147" width="28" height="48" rx="13" fill="#050914"/>
      <rect x="560" y="147" width="28" height="48" rx="13" fill="#050914"/>
    </g>
  </g>

  <text x="410" y="598"
        text-anchor="middle"
        font-family="Arial Black, Inter, Segoe UI Black, Arial, sans-serif"
        font-size="80"
        font-weight="900"
        letter-spacing="-4.2"
        textLength="778"
        lengthAdjust="spacingAndGlyphs"
        fill="#000000">InsurIntellect</text>
</svg>
