<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">InsurIntellect minimal clause evidence logo</title>
  <desc id="desc">A minimal blue and teal policy document mark with a citation badge above a bold InsurIntellect wordmark.</desc>

  <rect width="820" height="430" fill="#FFFFFF"/>

  <!-- Minimal product mark: local policy PDF + cited evidence. -->
  <g id="mark" transform="translate(0 4)" stroke-linejoin="round" stroke-linecap="round">
    <!-- rear evidence sheet -->
    <rect x="286" y="60" width="190" height="216" rx="28" fill="#E0F2FE" stroke="#0F172A" stroke-width="9"/>
    <path d="M437 60v48h39" fill="none" stroke="#0F172A" stroke-width="9"/>

    <!-- main policy page -->
    <rect x="322" y="36" width="212" height="242" rx="30" fill="#FFFFFF" stroke="#0F172A" stroke-width="10"/>
    <path d="M486 36v56h48" fill="#DBEAFE" stroke="#0F172A" stroke-width="10"/>

    <!-- document header -->
    <rect x="354" y="80" width="104" height="24" rx="12" fill="#1D9CFF"/>
    <text x="406" y="98" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">POLICY</text>

    <!-- clause lines -->
    <rect x="354" y="128" width="142" height="14" rx="7" fill="#0F172A" opacity="0.92"/>
    <rect x="354" y="158" width="112" height="14" rx="7" fill="#14B8A6"/>
    <rect x="354" y="188" width="132" height="14" rx="7" fill="#CBD5E1"/>
    <rect x="354" y="218" width="92" height="14" rx="7" fill="#CBD5E1"/>

    <!-- citation badge -->
    <rect x="490" y="132" width="88" height="58" rx="22" fill="#14B8A6" stroke="#0F172A" stroke-width="9"/>
    <text x="534" y="171" text-anchor="middle" font-family="Inter, Segoe UI Black, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">[1]</text>

    <!-- retrieval node accent, small and non-busy -->
    <circle cx="293" cy="236" r="17" fill="#1D9CFF" stroke="#0F172A" stroke-width="8"/>
    <circle cx="260" cy="236" r="8" fill="#14B8A6"/>
    <path d="M277 236h-9" stroke="#0F172A" stroke-width="7"/>
  </g>

  <text x="410" y="365"
        text-anchor="middle"
        font-family="Arial Black, Inter, Segoe UI Black, Arial, sans-serif"
        font-size="78"
        font-weight="900"
        letter-spacing="-4.1"
        textLength="768"
        lengthAdjust="spacingAndGlyphs"
        fill="#020617">InsurIntellect</text>
</svg>
