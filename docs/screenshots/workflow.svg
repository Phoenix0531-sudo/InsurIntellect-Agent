<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-label="InsurIntellect agent workflow">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748B"/></marker>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1180" height="560" rx="30" fill="#FFFFFF"/>
  <rect x="18" y="18" width="1144" height="524" rx="26" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="44" y="58" font-size="25" font-weight="800" fill="#0F172A">InsurIntellect: Agent Workflow</text>
    <text x="44" y="82" font-size="14" fill="#64748B">A single auditable clause agent, not a general autonomous trading or insurance-advice bot.</text>

    <g filter="url(#soft)">
      <rect x="58" y="144" width="150" height="92" rx="20" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="248" y="144" width="150" height="92" rx="20" fill="#EFF6FF" stroke="#BFDBFE"/>
      <rect x="438" y="144" width="150" height="92" rx="20" fill="#EFF6FF" stroke="#BFDBFE"/>
      <rect x="628" y="144" width="150" height="92" rx="20" fill="#ECFDF5" stroke="#BBF7D0"/>
      <rect x="818" y="144" width="150" height="92" rx="20" fill="#ECFDF5" stroke="#BBF7D0"/>
      <rect x="1008" y="144" width="112" height="92" rx="20" fill="#F8FAFC" stroke="#CBD5E1"/>
    </g>

    <g text-anchor="middle">
      <text x="133" y="178" font-size="17" font-weight="800" fill="#0F172A">User query</text><text x="133" y="202" font-size="12" fill="#64748B">Chinese clause question</text>
      <text x="323" y="178" font-size="17" font-weight="800" fill="#0F172A">Query guard</text><text x="323" y="202" font-size="12" fill="#64748B">empty · off-topic · advice</text>
      <text x="513" y="178" font-size="17" font-weight="800" fill="#0F172A">Retriever</text><text x="513" y="202" font-size="12" fill="#64748B">vector + BM25 + RRF</text>
      <text x="703" y="178" font-size="17" font-weight="800" fill="#0F172A">Evidence gate</text><text x="703" y="202" font-size="12" fill="#64748B">threshold + curation</text>
      <text x="893" y="178" font-size="17" font-weight="800" fill="#0F172A">Narrator</text><text x="893" y="202" font-size="12" fill="#64748B">LLM structures answer</text>
      <text x="1064" y="178" font-size="17" font-weight="800" fill="#0F172A">UI/API</text><text x="1064" y="202" font-size="12" fill="#64748B">citations visible</text>
    </g>
    <g stroke="#64748B" stroke-width="3" marker-end="url(#arrow)">
      <line x1="208" y1="190" x2="248" y2="190"/><line x1="398" y1="190" x2="438" y2="190"/><line x1="588" y1="190" x2="628" y2="190"/><line x1="778" y1="190" x2="818" y2="190"/><line x1="968" y1="190" x2="1008" y2="190"/>
    </g>

    <path d="M323 236 C323 295 234 310 234 360" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M703 236 C703 295 610 310 610 360" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M893 236 C893 295 950 310 950 360" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#soft)">
      <rect x="110" y="360" width="250" height="98" rx="22" fill="#FFFBEB" stroke="#FDE68A"/>
      <rect x="485" y="360" width="250" height="98" rx="22" fill="#FFFBEB" stroke="#FDE68A"/>
      <rect x="835" y="360" width="250" height="98" rx="22" fill="#FFFBEB" stroke="#FDE68A"/>
    </g>
    <g text-anchor="middle">
      <text x="235" y="396" font-size="17" font-weight="800" fill="#92400E">Boundary refusal</text>
      <text x="235" y="420" font-size="12.5" fill="#78350F">purchase advice · weather · empty question</text>
      <text x="610" y="396" font-size="17" font-weight="800" fill="#92400E">Insufficient evidence</text>
      <text x="610" y="420" font-size="12.5" fill="#78350F">weak score or no indexed document hit</text>
      <text x="960" y="396" font-size="17" font-weight="800" fill="#92400E">LLM unavailable</text>
      <text x="960" y="420" font-size="12.5" fill="#78350F">return retrieved excerpts with honest copy</text>
    </g>

    <rect x="248" y="491" width="684" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="590" y="511" text-anchor="middle" font-size="12.5" fill="#334155">Public contract: answer_kind + retrieved_chunks[] + confidence_score + response_time</text>
  </g>
</svg>
