<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-label="InsurIntellect smart retrieval schedule">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748B"/></marker>
  </defs>
  <rect width="1180" height="520" rx="30" fill="#FFFFFF"/>
  <rect x="18" y="18" width="1144" height="484" rx="26" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="44" y="58" font-size="25" font-weight="800" fill="#0F172A">InsurIntellect: Smart Retrieval Schedule</text>
    <text x="44" y="82" font-size="14" fill="#64748B">Two schedules keep the demo reliable: ingest-time indexing and ask-time evidence gating.</text>

    <text x="60" y="134" font-size="16" font-weight="800" fill="#0F172A">Ingest-time</text>
    <text x="60" y="287" font-size="16" font-weight="800" fill="#0F172A">Ask-time</text>

    <g>
      <line x1="180" y1="130" x2="1080" y2="130" stroke="#E2E8F0" stroke-width="4"/>
      <line x1="180" y1="283" x2="1080" y2="283" stroke="#E2E8F0" stroke-width="4"/>
      <g fill="#1D9CFF"><circle cx="220" cy="130" r="10"/><circle cx="410" cy="130" r="10"/><circle cx="600" cy="130" r="10"/><circle cx="790" cy="130" r="10"/><circle cx="980" cy="130" r="10"/></g>
      <g fill="#10B981"><circle cx="220" cy="283" r="10"/><circle cx="410" cy="283" r="10"/><circle cx="600" cy="283" r="10"/><circle cx="790" cy="283" r="10"/><circle cx="980" cy="283" r="10"/></g>
    </g>

    <g font-size="13" fill="#334155" text-anchor="middle">
      <text x="220" y="165" font-weight="700">Generate samples</text><text x="220" y="185" fill="#64748B">fake clauses only</text>
      <text x="410" y="165" font-weight="700">Extract pages</text><text x="410" y="185" fill="#64748B">PyMuPDF text</text>
      <text x="600" y="165" font-weight="700">Chunk corpus</text><text x="600" y="185" fill="#64748B">page-aware map</text>
      <text x="790" y="165" font-weight="700">Embed + BM25</text><text x="790" y="185" fill="#64748B">BGE / jieba</text>
      <text x="980" y="165" font-weight="700">Manifest ready</text><text x="980" y="185" fill="#64748B">left pane docs</text>

      <text x="220" y="318" font-weight="700">Validate</text><text x="220" y="338" fill="#64748B">question + boundary</text>
      <text x="410" y="318" font-weight="700">Retrieve top-k</text><text x="410" y="338" fill="#64748B">vector + BM25</text>
      <text x="600" y="318" font-weight="700">Curate citations</text><text x="600" y="338" fill="#64748B">dedupe doc/page</text>
      <text x="790" y="318" font-weight="700">Narrate</text><text x="790" y="338" fill="#64748B">timeout-aware LLM</text>
      <text x="980" y="318" font-weight="700">Return</text><text x="980" y="338" fill="#64748B">API + UI cards</text>
    </g>

    <g stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)">
      <line x1="233" y1="130" x2="394" y2="130"/><line x1="423" y1="130" x2="584" y2="130"/><line x1="613" y1="130" x2="774" y2="130"/><line x1="803" y1="130" x2="964" y2="130"/>
      <line x1="233" y1="283" x2="394" y2="283"/><line x1="423" y1="283" x2="584" y2="283"/><line x1="613" y1="283" x2="774" y2="283"/><line x1="803" y1="283" x2="964" y2="283"/>
    </g>

    <rect x="108" y="408" width="300" height="44" rx="22" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="258" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">CONTEXT_BUILD_TIMEOUT_SECS=20</text>
    <rect x="440" y="408" width="300" height="44" rx="22" fill="#ECFDF5" stroke="#BBF7D0"/>
    <text x="590" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">LLM_ANSWER_TIMEOUT_SECS=60</text>
    <rect x="772" y="408" width="300" height="44" rx="22" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="922" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Weak / advice / off-topic → refuse</text>
  </g>
</svg>
