name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # only cache when lock/deps files exist (avoids setup-python hard fail)
          cache: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/uv.lock') != '' && 'pip' || '' }}
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e . || pip install . || true
          fi
          pip install pytest ruff

      - name: Required project files
        run: |
          test -f README.md
          test -f LICENSE || test -f LICENSE.md

      - name: Ruff (hard — critical rules)
        run: ruff check . --select E9,F63,F7,F82

      - name: Pytest (hard, tests/ only)
        run: |
          set -e
          if [ -d tests ]; then
            python -m pytest -q tests
          elif [ -d Test ]; then
            python -m pytest -q Test
          elif [ -d test ]; then
            python -m pytest -q test
          else
            mapfile -t roots < <(ls test_*.py 2>/dev/null || true)
            if [ ${#roots[@]} -gt 0 ]; then
              python -m pytest -q "${roots[@]}"
            else
              echo "No tests directory; structure checks only"
            fi
          fi

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: insurintellect-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-check image entrypoint
        run: |
          docker run --rm -d --name ci-smoke -p 8766:8766 \
            -e HOST=0.0.0.0 -e PORT=8766 -e DEBUG=false \
            -e CHROMA_DISABLE_TELEMETRY=1 \
            insurintellect-agent:ci
          sleep 8
          docker exec ci-smoke python -c "import urllib.request,json; r=urllib.request.urlopen('http://127.0.0.1:8766/api/v1/health/',timeout=10); print('health', r.status, r.read()[:120])"
          docker rm -f ci-smoke
