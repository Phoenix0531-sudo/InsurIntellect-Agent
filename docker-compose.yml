name: insurintellect-agent

services:
  app:
    image: insurintellect-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurintellect-agent
    ports:
      - "8766:8766"
    environment:
      HOST: 0.0.0.0
      PORT: 8766
      DEBUG: "true"
      SIMPLE_RAG_MODE: "true"
      ENABLE_QUERY_REWRITING: "false"
      ENABLE_QUERY_ROUTING: "false"
      CHROMA_ANONYMIZED_TELEMETRY: "false"
      CHROMA_DISABLE_TELEMETRY: "1"
      CHROMA_PERSIST_DIRECTORY: /app/data/vector_db/chroma
      PROCESSED_DATA_PATH: /app/data/processed
      PDF_STORAGE_PATH: /app/data/documents/pdfs
      DATABASE_URL: sqlite:////app/data/database/app.db
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:31876/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      OPENAI_MODEL_CORE: ${OPENAI_MODEL_CORE:-gpt-5.4}
      OPENAI_MODEL_LIGHT: ${OPENAI_MODEL_LIGHT:-gpt-5.4}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-local:hash}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.32}
    volumes:
      - ./data:/app/data
      - ./samples:/app/samples:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; port=os.getenv('PORT','8766'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/v1/health/', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
