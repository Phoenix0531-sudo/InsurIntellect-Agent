[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "data/vector_db",
  "data/processed",
  "data/documents",
  "app/data",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::starlette.testclient.StarletteDeprecationWarning",
  "ignore::sqlalchemy.exc.MovedIn20Warning",
]
