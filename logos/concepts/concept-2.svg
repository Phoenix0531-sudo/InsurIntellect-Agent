<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InsurIntellect concept 2 — citation card mark">
  <!-- Clause evidence / citation: stacked cards with page cue and highlight -->
  <g id="icon">
    <rect x="28" y="28" width="456" height="456" rx="96" fill="#0B1F33"/>

    <!-- Back card -->
    <g id="back-card" opacity="0.55">
      <rect x="118" y="98" width="250" height="300" rx="28" fill="#16324D" transform="rotate(-8 243 248)"/>
    </g>

    <!-- Front citation card -->
    <g id="citation-card">
      <rect x="132" y="112" width="248" height="288" rx="28" fill="#FFFFFF"/>

      <!-- Doc chip -->
      <rect x="156" y="140" width="72" height="28" rx="14" fill="#1D9CFF"/>
      <rect x="240" y="146" width="48" height="16" rx="8" fill="#D7EBFF"/>

      <!-- Page number cue -->
      <circle cx="340" cy="154" r="18" fill="#E8F4FF"/>
      <rect x="332" y="148" width="16" height="12" rx="3" fill="#1D9CFF"/>

      <!-- Body lines -->
      <rect x="156" y="196" width="180" height="14" rx="7" fill="#C9D7E6"/>
      <rect x="156" y="228" width="156" height="14" rx="7" fill="#C9D7E6"/>
      <rect x="156" y="260" width="168" height="14" rx="7" fill="#C9D7E6"/>

      <!-- Evidence highlight strip -->
      <rect x="148" y="300" width="216" height="48" rx="14" fill="#1D9CFF"/>
      <rect x="168" y="316" width="120" height="16" rx="8" fill="#FFFFFF" opacity="0.95"/>

      <!-- Bottom meta dots -->
      <circle cx="168" cy="372" r="8" fill="#1D9CFF"/>
      <rect x="188" y="366" width="96" height="12" rx="6" fill="#A8C4DC"/>
    </g>
  </g>
</svg>
