<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InsurIntellect concept 1 — shield with clause document">
  <!-- Shield + document: insurance protection wrapping a policy page -->
  <g id="icon">
    <!-- Soft plate behind the mark -->
    <circle cx="256" cy="256" r="236" fill="#F4F9FF"/>

    <!-- Outer shield -->
    <path
      id="shield"
      d="M256 52
         C196 72 128 78 88 86
         V210
         C88 318 156 400 256 448
         C356 400 424 318 424 210
         V86
         C384 78 316 72 256 52Z"
      fill="#1D9CFF"/>

    <!-- Inner shield panel -->
    <path
      d="M256 88
         C210 104 156 110 124 116
         V212
         C124 298 176 362 256 402
         C336 362 388 298 388 212
         V116
         C356 110 302 104 256 88Z"
      fill="#FFFFFF"/>

    <!-- Document body -->
    <g id="document">
      <rect x="176" y="148" width="160" height="196" rx="18" fill="#E8F4FF"/>
      <rect x="176" y="148" width="160" height="196" rx="18" fill="none" stroke="#1D9CFF" stroke-width="10"/>

      <!-- Folded corner -->
      <path d="M300 148 H336 V184 Z" fill="#B8DCFF"/>
      <path d="M300 148 V184 H336" fill="none" stroke="#1D9CFF" stroke-width="8" stroke-linejoin="round"/>

      <!-- Clause lines -->
      <rect x="204" y="188" width="88" height="14" rx="7" fill="#1D9CFF" opacity="0.85"/>
      <rect x="204" y="220" width="104" height="12" rx="6" fill="#7ABFFF"/>
      <rect x="204" y="248" width="72" height="12" rx="6" fill="#7ABFFF"/>
      <rect x="204" y="276" width="96" height="12" rx="6" fill="#7ABFFF"/>

      <!-- Citation highlight bar -->
      <rect x="196" y="304" width="120" height="22" rx="8" fill="#1D9CFF"/>
    </g>
  </g>
</svg>
