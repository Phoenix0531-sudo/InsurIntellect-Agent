<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InsurIntellect concept 3 — RAG search fusion">
  <!-- Abstract RAG / search: dual sources fused into a grounded answer node -->
  <g id="icon">
    <circle cx="256" cy="256" r="236" fill="#F3F8FC"/>

    <!-- Orbit ring -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="#BFDFFF" stroke-width="18"/>

    <!-- Source node A (vector) -->
    <g id="source-vector">
      <circle cx="146" cy="168" r="46" fill="#1D9CFF"/>
      <circle cx="146" cy="168" r="18" fill="#FFFFFF"/>
    </g>

    <!-- Source node B (lexical/BM25) -->
    <g id="source-lexical">
      <circle cx="366" cy="168" r="46" fill="#0B6BCB"/>
      <rect x="348" y="154" width="36" height="28" rx="8" fill="#FFFFFF"/>
    </g>

    <!-- Fusion beams -->
    <g id="fusion-beams">
      <path d="M170 200 L240 286" stroke="#1D9CFF" stroke-width="18" stroke-linecap="round"/>
      <path d="M342 200 L272 286" stroke="#0B6BCB" stroke-width="18" stroke-linecap="round"/>
    </g>

    <!-- Grounded answer node (evidence gate) -->
    <g id="answer-node">
      <circle cx="256" cy="318" r="70" fill="#0B1F33"/>
      <circle cx="256" cy="318" r="42" fill="#1D9CFF"/>
      <!-- Check / grounded mark -->
      <path d="M232 318 L248 334 L286 296"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="16"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- Small search cue -->
    <g id="search-cue">
      <circle cx="372" cy="372" r="34" fill="none" stroke="#1D9CFF" stroke-width="16"/>
      <path d="M396 396 L424 424" stroke="#1D9CFF" stroke-width="16" stroke-linecap="round"/>
    </g>
  </g>
</svg>
