<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InsurIntellect concept 4 — shield with evidence network">
  <!-- Hybrid: shield silhouette + clause bars + retrieval nodes -->
  <g id="icon">
    <rect x="28" y="28" width="456" height="456" rx="108" fill="#0B1F33"/>

    <!-- Shield silhouette -->
    <path
      id="shield"
      d="M256 78
         C198 98 142 104 108 112
         V228
         C108 328 168 396 256 438
         C344 396 404 328 404 228
         V112
         C370 104 314 98 256 78Z"
      fill="#1D9CFF"/>

    <!-- Inner dark panel for contrast -->
    <path
      d="M256 112
         C210 128 164 134 140 140
         V230
         C140 308 186 360 256 392
         C326 360 372 308 372 230
         V140
         C348 134 302 128 256 112Z"
      fill="#062033"/>

    <!-- Clause stack -->
    <g id="clause-stack">
      <rect x="176" y="176" width="160" height="22" rx="11" fill="#FFFFFF"/>
      <rect x="176" y="218" width="128" height="18" rx="9" fill="#7ABFFF"/>
      <rect x="176" y="254" width="144" height="18" rx="9" fill="#7ABFFF"/>
      <!-- Highlighted evidence row -->
      <rect x="168" y="292" width="176" height="34" rx="12" fill="#FFFFFF"/>
      <rect x="184" y="302" width="96" height="14" rx="7" fill="#1D9CFF"/>
    </g>

    <!-- Retrieval nodes on the rim -->
    <g id="nodes">
      <circle cx="140" cy="196" r="16" fill="#FFFFFF"/>
      <circle cx="372" cy="196" r="16" fill="#FFFFFF"/>
      <circle cx="256" cy="392" r="18" fill="#FFFFFF"/>
      <circle cx="256" cy="392" r="8" fill="#1D9CFF"/>
    </g>
  </g>
</svg>
