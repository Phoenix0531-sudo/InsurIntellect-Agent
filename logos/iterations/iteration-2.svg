<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InsurIntellect iteration 2 — simplified for favicon">
  <!-- Favicon-first: fewer details, bigger shapes, still reads as citation card -->
  <g id="icon">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="#0B1F33"/>

    <!-- Single solid card, no rotated back layer -->
    <g id="citation-card">
      <rect x="128" y="96" width="256" height="320" rx="36" fill="#FFFFFF"/>

      <!-- Top bar: doc + page -->
      <rect x="160" y="136" width="96" height="40" rx="20" fill="#1D9CFF"/>
      <circle cx="320" cy="156" r="24" fill="#E8F4FF"/>
      <rect x="308" y="146" width="24" height="20" rx="5" fill="#1D9CFF"/>

      <!-- Two fat clause lines only -->
      <rect x="160" y="212" width="176" height="24" rx="12" fill="#C5D6E8"/>
      <rect x="160" y="260" width="140" height="24" rx="12" fill="#C5D6E8"/>

      <!-- Big evidence block -->
      <rect x="148" y="316" width="216" height="64" rx="18" fill="#1D9CFF"/>
      <rect x="176" y="336" width="120" height="24" rx="12" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
