<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InsurIntellect iteration 1 — polished citation card">
  <!-- Base polish of concept-2: cleaner spacing, thicker shapes for small sizes -->
  <g id="icon">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="#0B1F33"/>

    <!-- Back card -->
    <g id="back-card">
      <rect x="126" y="108" width="236" height="284" rx="30" fill="#16324D" transform="rotate(-7 244 250)"/>
    </g>

    <!-- Front citation card -->
    <g id="citation-card">
      <rect x="138" y="118" width="236" height="276" rx="30" fill="#FFFFFF"/>

      <!-- Doc chip + meta -->
      <rect x="164" y="148" width="78" height="32" rx="16" fill="#1D9CFF"/>
      <rect x="254" y="156" width="52" height="16" rx="8" fill="#D7EBFF"/>

      <!-- Page cue -->
      <circle cx="340" cy="164" r="20" fill="#E8F4FF"/>
      <rect x="330" y="156" width="20" height="16" rx="4" fill="#1D9CFF"/>

      <!-- Body lines -->
      <rect x="164" y="210" width="168" height="16" rx="8" fill="#C5D6E8"/>
      <rect x="164" y="244" width="144" height="16" rx="8" fill="#C5D6E8"/>
      <rect x="164" y="278" width="156" height="16" rx="8" fill="#C5D6E8"/>

      <!-- Evidence highlight -->
      <rect x="156" y="318" width="200" height="44" rx="14" fill="#1D9CFF"/>
      <rect x="176" y="332" width="112" height="16" rx="8" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
