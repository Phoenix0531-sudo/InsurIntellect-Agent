<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InsurIntellect iteration 4 — monoline card with blue frame">
  <!-- Light-surface variant: white plate, blue framed card, denser evidence UI -->
  <g id="icon">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="#F4F9FF"/>

    <!-- Soft shadow plate -->
    <rect x="118" y="118" width="276" height="300" rx="36" fill="#D7EBFF"/>

    <!-- Main card -->
    <g id="citation-card">
      <rect x="132" y="104" width="248" height="288" rx="32" fill="#FFFFFF" stroke="#1D9CFF" stroke-width="14"/>

      <!-- Header row -->
      <rect x="164" y="140" width="72" height="28" rx="14" fill="#1D9CFF"/>
      <rect x="248" y="148" width="56" height="12" rx="6" fill="#B8DCFF"/>
      <circle cx="340" cy="154" r="16" fill="#E8F4FF" stroke="#1D9CFF" stroke-width="8"/>

      <!-- Lines -->
      <rect x="164" y="196" width="176" height="14" rx="7" fill="#A8C4DC"/>
      <rect x="164" y="228" width="152" height="14" rx="7" fill="#A8C4DC"/>
      <rect x="164" y="260" width="164" height="14" rx="7" fill="#A8C4DC"/>

      <!-- Evidence highlight with left accent bar -->
      <rect x="156" y="300" width="200" height="56" rx="16" fill="#E8F4FF"/>
      <rect x="156" y="300" width="16" height="56" rx="8" fill="#1D9CFF"/>
      <rect x="188" y="318" width="120" height="20" rx="10" fill="#1D9CFF"/>
    </g>
  </g>
</svg>
