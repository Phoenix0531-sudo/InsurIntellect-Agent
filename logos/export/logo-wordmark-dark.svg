<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" role="img" aria-label="InsurIntellect combination mark on dark">
  <!-- Dark-surface combination mark for dark UI / dark README banners -->
  <rect width="1024" height="512" rx="48" fill="#0B1F33"/>

  <g id="icon" transform="translate(48, 96) scale(0.625)">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="#16324D"/>
    <g id="citation-card">
      <rect x="124" y="100" width="264" height="312" rx="40" fill="#FFFFFF"/>
      <rect x="156" y="140" width="104" height="44" rx="22" fill="#1D9CFF"/>
      <rect x="300" y="140" width="52" height="44" rx="14" fill="#E8F4FF"/>
      <rect x="312" y="152" width="28" height="20" rx="5" fill="#1D9CFF"/>
      <rect x="156" y="220" width="184" height="28" rx="14" fill="#C5D6E8"/>
      <rect x="156" y="272" width="148" height="28" rx="14" fill="#C5D6E8"/>
      <rect x="144" y="328" width="224" height="60" rx="20" fill="#1D9CFF"/>
      <rect x="176" y="346" width="128" height="24" rx="12" fill="#FFFFFF"/>
    </g>
  </g>

  <g id="wordmark" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="400" y="248" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">InsurIntellect</text>
    <text x="404" y="304" font-size="28" font-weight="500" fill="#7ABFFF" letter-spacing="0.5">Clause-grounded RAG</text>
  </g>
</svg>
